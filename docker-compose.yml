# DAASH ERP & DTE · PostgreSQL 16 + Backend Spring Boot + Frontend React
# Uso: docker compose up -d --build   →   http://localhost:8088
name: daash
services:
  db:
    image: postgres:16-alpine
    container_name: daash-db
    environment:
      POSTGRES_DB: daash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo
    ports: ["5442:5432"]
    volumes: ["daash-datos:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daash"]
      interval: 3s
      retries: 20

  backend:
    build: ./daash-backend
    container_name: daash-backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/daash?currentSchema=daash
      DB_OWNER_PASSWORD: demo
      CORS_ORIGINS: http://localhost:8088
    ports: ["8080:8080"]

  frontend:
    build: ./daash-erp
    container_name: daash-frontend
    depends_on: [backend]
    ports: ["8088:80"]

volumes:
  daash-datos:
